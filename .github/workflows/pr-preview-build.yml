name: PR Preview - Build

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  build:
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-build.yml@adamziel/build-command-reusable-workflows
    with:
      # Always produce both zips; the blueprint decides which to install.
      artifacts: |
        alpha=build/alpha.zip
        beta=build/beta.zip
      blueprint-from-build: blueprint.json
      build-command: |
        set -euo pipefail
        mkdir -p build
        for slug in alpha beta; do
          ( cd "plugins/$slug" && zip -r "../../build/$slug.zip" . )
        done

        # Default checkout is shallow; fetch the base ref so we can diff.
        git fetch --no-tags --depth=50 origin "$GITHUB_BASE_REF"
        changed=$(
          git diff --name-only "origin/$GITHUB_BASE_REF...HEAD"             | awk -F/ '/^plugins\// {print $2}' | sort -u
        )

        # Build the steps array dynamically from the changed slugs. Falls
        # back to "install both" when nothing under plugins/ changed, so the
        # preview button still does something sensible on docs-only PRs.
        node - "$changed" <<'NODE' > blueprint.json
        const changed = (process.argv[2] || '').split(/\s+/).filter(Boolean);
        const slugs = changed.length ? changed : ['alpha', 'beta'];
        const steps = slugs.map((slug) => ({
          step: 'installPlugin',
          pluginZipFile: { resource: 'url', url: '{{ARTIFACT_URL:' + slug + '}}' },
          options: { activate: true },
        }));
        process.stdout.write(JSON.stringify({
          $schema: 'https://playground.wordpress.net/blueprint-schema.json',
          steps,
        }, null, 2));
        NODE

        echo "Generated blueprint.json:"
        cat blueprint.json
